name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Pack smoke
        run: |
          make pack
          test -f dist/*-linux-amd64.tar.gz
          ( cd dist && sha256sum -c SHA256SUMS --quiet )
